name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report changed paths to PR summary
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          echo "### 本次 PR 異動檔案清單（請確認符合角色目錄邊界）" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only "FETCH_HEAD...HEAD" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce role directory boundaries
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }} # via env: branch names are user-controlled
        run: |
          case "$HEAD_REF" in
            feat/ui-*)          allowed='^(src/|data/curated/)' ;;
            feat/fare-engine-*) allowed='^(engine/|data/curated/)' ;;
            feat/route-intel-*) allowed='^(services/|data/)' ;;
            *) echo "分支 $HEAD_REF 不在三個組員角色前綴內，略過目錄邊界檢查（架構師分支走 CODEOWNERS 審查）"; exit 0 ;;
          esac
          outside=$(git diff --name-only "FETCH_HEAD...HEAD" | grep -Ev "$allowed" || true)
          if [ -n "$outside" ]; then
            echo "::error::$HEAD_REF 只能修改符合 $allowed 的檔案，以下檔案越界（請還原，或改由架構師處理）："
            echo "$outside"
            exit 1
          fi
          echo "目錄邊界檢查通過"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npx vitest run

      - name: Build static bundle
        run: npm run build

  gateway-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: gateway/requirements.txt

      - name: Install gateway dependencies
        run: pip install -r gateway/requirements.txt

      - name: Run gateway pytest suite
        run: pytest gateway/test_main.py -v
