name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npx vitest run

      - name: Build static bundle
        run: npm run build

  gateway-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: gateway/requirements.txt

      - name: Install gateway dependencies
        run: pip install -r gateway/requirements.txt

      - name: Run gateway pytest suite
        run: pytest gateway/test_main.py -v
